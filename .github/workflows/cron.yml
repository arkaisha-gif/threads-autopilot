name: Threads Autopilot Runner

on:
  schedule:
    # Berjalan di menit ke-10 dan ke-40 tiap jam (menghindari jam sibuk menit 00 dan 30)
    - cron: '10,40 * * * *'
  workflow_dispatch:

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # Otomatis stop jika lewat 15 menit agar tidak menggantung 21 menit lagi

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Threads Worker
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDS_BASE64: ${{ secrets.GCP_CREDS_BASE64 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python worker.py
