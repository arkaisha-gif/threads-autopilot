name: Threads Autopilot Runner

on:
  schedule:
    # Sabuk pengaman 1: Cron bawaan GitHub setiap 20 menit
    - cron: '*/20 * * * *'
  workflow_dispatch: # Sabuk pengaman 2: Pemicu otomatis estafet & manual

permissions:
  actions: write
  contents: read

concurrency:
  group: threads-autopilot-single-group
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Threads Worker (Cepat 1-2 Menit)
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDS_BASE64: ${{ secrets.GCP_CREDS_BASE64 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python worker.py

      - name: Auto-Trigger Run Berikutnya (Jeda 15 Menit)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Worker selesai! Menunggu 15 menit sebelum memicu siklus berikutnya..."
          sleep 900
          TOKEN="${GH_PAT:-$DEFAULT_TOKEN}"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autopilot.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Siklus berikutnya berhasil dipicu otomatis!"
