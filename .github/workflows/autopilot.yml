name: Threads Autopilot Runner

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: threads-autopilot-30m
  cancel-in-progress: false

jobs:
  run-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Threads Worker
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDS_BASE64: ${{ secrets.GCP_CREDS_BASE64 }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python worker.py

      - name: Auto-Trigger Siklus Berikutnya (30 Menit)
        if: always()
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          DEFAULT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Semua PENDING yang jatuh tempo telah selesai diproses. Menunggu 30 menit..."
          sleep 1800
          TOKEN="${GH_PAT:-$DEFAULT_TOKEN}"
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/autopilot.yml/dispatches" \
            -d '{"ref":"main"}'
